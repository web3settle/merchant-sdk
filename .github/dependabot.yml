# Premortem F4: Dependabot opens dependency PRs but the runtime block is
# pinned (no carets), so any update is intentional. We forbid auto-merge for
# runtime deps via the `assignees` + `reviewers` gates so a PII-touching
# package change always lands a human review.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    # Development happens on `develop`; `main` only moves on a release promotion.
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # 2026-10-26: #65 jumped to typescript 7 and eslint 10, which broke
    # `npm ci` (typescript-eslint 8.72 peers typescript <6.1; jsx-a11y and
    # react plugins peer eslint <=9). Hold these until the plugins catch up.
    ignore:
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
    # Runtime deps require human review — never auto-merge.
    allow:
      - dependency-type: "all"
    groups:
      runtime-deps:
        dependency-type: "production"
      dev-deps:
        dependency-type: "development"
    labels:
      - "dependencies"
      - "supply-chain"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # B10 (2026-10-20): every `uses:` in `.github/workflows/` is pinned to a full
  # commit SHA with a `# vX.Y.Z` trailing comment; Dependabot reads the comment
  # and proposes SHA bumps for the actions themselves.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "supply-chain"
    commit-message:
      prefix: "ci(deps)"
